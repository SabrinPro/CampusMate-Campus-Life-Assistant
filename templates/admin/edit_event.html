<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMate - Edit Event</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="admin-nav">

        <div class="logo">CampusMate Admin</div>

        <div class="nav-links">
            <a href="/admin">Dashboard</a>
            <a href="/admin/users">Users</a>
            <a href="/admin/events">Events</a>
            <a href="/admin/notices">Notices</a>
            <a href="/admin/groups">Groups</a>
            <a href="/admin/issues">Issues</a>
            <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
        </div>

    </nav>


    <main class="admin-container">

        <div class="admin-header">
            <h1>Edit <span>Event</span></h1>
            <p>Update event information.</p>
        </div>


        <div class="form-card">

            <h2>Update <span>Event</span></h2>

            <form action="/admin/events/edit/{{ event.id }}" method="POST">

                <div class="form-grid">

                    <div>
                        <label>Event Title</label>
                        <input
                            type="text"
                            name="title"
                            value="{{ event.title }}"
                            required
                        >
                    </div>


                    <div>
                        <label>Date</label>
                        <input
                            type="date"
                            name="event_date"
                            value="{{ event.date.strftime('%Y-%m-%d') }}"
                            required
                        >
                    </div>


                    <div>
                        <label>Time</label>
                        <input
                            type="time"
                            name="event_time"
                            value="{{ event.time.strftime('%H:%M') }}"
                            required
                        >
                    </div>


                    <div>
                        <label>Location</label>
                        <input
                            type="text"
                            name="location"
                            value="{{ event.location }}"
                            required
                        >
                    </div>


                    <div>
                        <label>Maximum Seats</label>
                        <input
                            type="number"
                            name="max_seats"
                            value="{{ event.max_seats }}"
                            min="1"
                            required
                        >
                    </div>

                </div>


                <label>Description</label>

                <textarea
                    name="description"
                    required
                >{{ event.description }}</textarea>


                <button type="submit" class="green-button">
                    Save Changes
                </button>

                <a href="/admin/events" class="small-btn">
                    Cancel
                </a>

            </form>

        </div>

    </main>


    <footer>
        © 2026 CampusMate Admin Panel.
    </footer>

</body>
</html>
